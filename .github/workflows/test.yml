name: Inquisition V2 optional tooling
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check skill entrypoint and optional Python tools
        run: |
          test -f skills/adeptus-inquisition/SKILL.md
          grep -q '^name: adeptus-inquisition$' skills/adeptus-inquisition/SKILL.md
          python3 -m unittest discover -s tests -v
          python3 -m inquisition.evaluation.cli --help
  offline-vally:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VALLY_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install known test version of optional grader
        run: npm install --global @microsoft/vally-cli@0.21.0
      - name: Lint and grade real offline fixture with recorded string arguments
        run: |
          vally lint --eval-spec evals/process/eval.yaml
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); r=json.loads(pathlib.Path("fixtures/adeptus_run_sample.json").read_text()); r["events"][1]["tool_calls"][0]["arguments"]="python -m unittest"; (p/"run.json").write_text(json.dumps(r))'
          python3 -m inquisition.evaluation.cli export-atif --input "$RUNNER_TEMP/run.json" --atif "$RUNNER_TEMP/run.atif.json" --provenance "$RUNNER_TEMP/run.provenance.json"
          python3 -m inquisition.evaluation.cli grade --atif "$RUNNER_TEMP/run.atif.json" --profile evals/process/eval.yaml --stimulus recorded-branch-run --output "$RUNNER_TEMP/grade.jsonl"
          test -s "$RUNNER_TEMP/grade.jsonl"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); a=json.loads((p/"run.atif.json").read_text()); assert a["steps"][1]["tool_calls"][0]["arguments"]=={"raw_arguments":"python -m unittest"}; assert json.loads((p/"run.provenance.json").read_text())["completeness"]=="PARTIAL"; assert all(isinstance(json.loads(line),dict) for line in (p/"grade.jsonl").read_text().splitlines() if line.strip())'
