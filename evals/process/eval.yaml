name: recorded-process-diagnostics
description: Observed trace diagnostics only; independent acceptance remains mandatory.
version: "2.0"
stimuli:
  - name: recorded-branch-run
    prompt: "Grade an externally recorded process execution."
    graders:
      - type: exit-success
      - type: max-repeat
        name: repeated-identical-actions
        config:
          max: 5
          match: name-args
          max_cycle_period: 2
