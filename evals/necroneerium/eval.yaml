name: necroneerium-recorded-process
description: Observed trace diagnostics only; direct application acceptance and Shade remain mandatory.
version: "1.2"
stimuli:
  - name: recorded-branch-run
    prompt: "Grade an externally recorded Necroneerium execution."
    graders:
      - type: exit-success
      - type: max-repeat
        name: repeated-identical-actions
        config:
          max: 5
          match: name-args
          max_cycle_period: 2
